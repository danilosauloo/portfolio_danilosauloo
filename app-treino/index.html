<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino — Danilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b09;
    --bg-soft:#0c1310;
    --card:#111a16;
    --card-border:rgba(255,255,255,0.06);
    --ink:#eef4f1;
    --ink-dim:#8ea69b;
    --ink-faint:#5c7169;
    --accent:#ff8a3d;
    --accent-dim:#3a2313;
    --amber:#e0ab4d;
    --amber-bg:#332a15;
    --red:#ea6a52;
    --red-bg:#3a1d16;
    --icon-bg:#f4f2ea;
    --icon-ink:#161616;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #10201a 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex; justify-content:center;
    min-height:100vh;
    padding:0;
  }
  .phone{
    width:100%; max-width:430px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex; flex-direction:column;
    border-left:1px solid var(--card-border);
    border-right:1px solid var(--card-border);
  }

  /* header */
  .app-header{
    padding:22px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .app-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px; font-weight:700; letter-spacing:0.2px;
  }
  .app-title span{color:var(--accent);}
  .app-sub{color:var(--ink-faint); font-size:12px; margin-top:2px; font-weight:500;}
  .streak{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--card-border);
    padding:8px 12px; border-radius:100px; font-size:12px; color:var(--ink-dim); font-weight:600;
  }
  .streak b{color:var(--accent); font-weight:700;}

  /* tabs */
  .tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding:4px 20px 16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:100px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:13px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tab .d{font-size:13px;}
  .tab .m{font-size:9.5px; font-weight:500; opacity:.75; text-transform:uppercase; letter-spacing:.04em;}
  .tab.active{
    background:var(--accent); color:#08150d; border-color:var(--accent);
  }
  .tab.active .m{color:#241206;}

  /* day header */
  .day-panel{display:none; padding:0 20px 120px; animation:fade .25s ease;}
  .day-panel.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .day-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px;
  }
  .day-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px; margin:0; font-weight:700;
  }
  .day-count{color:var(--ink-faint); font-size:12px; font-weight:600;}

  .muscle-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:16px; margin-bottom:16px;
    border-bottom:1px solid var(--card-border);
    scrollbar-width:none;
  }
  .muscle-row::-webkit-scrollbar{display:none;}
  .muscle-chip{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:64px;
  }
  .muscle-chip .badge{
    width:52px; height:52px; border-radius:14px;
    background:var(--card-border);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#241712,#120b08);
    border:1px solid var(--card-border);
  }
  .muscle-chip span{font-size:9.5px; color:var(--ink-dim); font-weight:600; text-align:center;}

  /* exercise list */
  .ex-section-label{
    font-size:11px; letter-spacing:.08em; color:var(--ink-faint);
    text-transform:uppercase; font-weight:700; margin:18px 0 8px;
  }
  .ex-card{
    display:flex; gap:12px; align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--card-border);
    cursor:pointer;
  }
  .ex-card:last-child{border-bottom:none;}
  .ex-thumb{
    width:58px; height:58px; border-radius:14px;
    background:var(--icon-bg);
    position:relative; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    overflow:visible;
  }
  .ex-thumb svg.pict{width:38px; height:38px;}
  .muscle-tag{
    position:absolute; bottom:-6px; right:-6px;
    width:26px; height:26px; border-radius:8px;
    background:#0d1a14; border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
  }
  .muscle-tag svg{width:16px; height:16px;}

  .ex-info{flex:1; min-width:0;}
  .ex-tag{
    display:inline-block; font-size:9.5px; font-weight:700;
    padding:3px 8px; border-radius:6px; letter-spacing:.03em;
    margin-bottom:5px; text-transform:uppercase;
  }
  .ex-tag.warm{background:var(--amber-bg); color:var(--amber);}
  .ex-tag.drop{background:var(--red-bg); color:var(--red);}
  .ex-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px; font-weight:600; line-height:1.25;
    margin-bottom:4px;
  }
  .ex-meta{font-size:12px; color:var(--ink-dim); font-weight:500;}
  .ex-type{color:var(--accent); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.03em;}
  .ex-meta b{color:var(--ink-dim); font-weight:600;}
  .ex-meta .dot{margin:0 5px; opacity:.5;}
  .ex-check{
    width:22px; height:22px; border-radius:50%;
    border:1.5px solid var(--card-border);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .ex-check svg{width:12px;height:12px; opacity:0; transition:opacity .15s ease;}
  .ex-card.done .ex-check{background:var(--accent); border-color:var(--accent);}
  .ex-card.done .ex-check svg{opacity:1;}
  .ex-card.done .ex-name{color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--ink-faint);}

  .finisher-card{
    display:flex; gap:12px; align-items:center; padding:12px 4px;
  }

  /* footer button */
  .footer-bar{
    position:sticky; bottom:0; left:0; right:0;
    padding:14px 20px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--bg) 55%, rgba(7,11,9,0));
    display:flex; gap:10px; align-items:center;
    margin-top:-90px;
  }
  .progress-pill{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%;
    background:var(--card); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:var(--accent);
  }
  .start-btn{
    flex:1;
    background:var(--accent);
    color:#08150d;
    border:none; border-radius:100px;
    padding:16px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14.5px; letter-spacing:.03em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(67,255,122,0.45);
    transition:transform .12s ease;
  }
  .start-btn:active{transform:scale(0.97);}

  ::selection{background:var(--accent); color:#08150d;}
</style>
</head>

      <span class="day-count">${d.exercises.length + d.finishers.length} exercícios</span>
    </div>
    <div class="muscle-row">${muscleChips}</div>
    ${exCards}
    <div class="ex-section-label">Finalizador</div>
    ${finCards}
  </div>`;
});

// footer (shared, follows active day's short name)
panelsEl.insertAdjacentHTML('afterend', `
  <div class="footer-bar">
    <div class="progress-pill" id="progressPill">0/0</div>
    <button class="start-btn" id="startBtn" onclick="startWorkout()">Iniciar treino</button>
  </div>
`);

function selectDay(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  document.querySelectorAll('.day-panel').forEach((p,idx)=>p.classList.toggle('active', idx===i));
  updateProgress();
}

function toggleDone(el){
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress(){
  const activePanel = document.querySelector('.day-panel.active');
  const cards = activePanel.querySelectorAll('.ex-card');
  const done = activePanel.querySelectorAll('.ex-card.done').length;
  document.getElementById('progressPill').textContent = `${done}/${cards.length}`;
}

function startWorkout(){
  const activePanel = document.querySelector('.day-panel.active');
  activePanel.scrollIntoView({behavior:'smooth', block:'start'});
  const btn = document.getElementById('startBtn');
  btn.textContent = 'Bom treino 💪';
  setTimeout(()=> btn.textContent = 'Iniciar treino', 1800);
}

updateProgress();
</script>
</body>
</html>
